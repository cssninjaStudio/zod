---
layout: minimal
title: Login
---

<div class="login-wrapper">
  <!--Nav-->
  <div class="login-nav">
    <div class="container">
      <div class="login-nav-inner">
        <div class="start">
          <a href="/">
            <img
              class="brand-logo"
              src="/img/logo/zod-text-primary.svg"
              alt="Product logo"
            />
          </a>
        </div>
        <div class="end">
          <label class="theme-toggle mask mask-blob">
            <input
              type="checkbox"
              x-on:change="toggleTheme()"
              :checked="$store.app.isDark"
            />
            <span class="theme-toggle-inner">
              <i class="sun-icon iconify" data-icon="feather:sun"></i>
              <i class="moon-icon iconify" data-icon="feather:moon"></i>
            </span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <!--Hero-->
  <div class="hero is-fullheight">
    <div class="hero-body">
      <div class="container">
        <div class="columns is-vcentered">
          <div class="column">
            <div class="login-caption">
              <h1 class="title is-2 is-bold is-leading">Recover Password</h1>
              <p>
                Lorem ipsum dolor sit amet, consectetur adipiscing elit. Verum
                hoc idem saepe faciamus.
              </p>
            </div>

            <div class="login-form">
              <form>
                <div class="field">
                  <label>Email Address</label>
                  <div class="control has-icon">
                    <div class="form-icon">
                      <i class="iconify" data-icon="feather:mail"></i>
                    </div>
                    <input
                      type="text"
                      class="input"
                      placeholder="Enter your email"
                    />
                  </div>
                </div>
                <div class="field">
                  <div class="buttons">
                    <button class="button is-primary is-fullwidth raised">
                      Reset Password
                    </button>
                  </div>

                  <div class="login-link">
                    <a href="/auth-login.html">Back to Login</a>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
