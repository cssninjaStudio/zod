<div
  x-data="initDropdown()"
  @click.away="close()"
  class="dropdown-wrap is-right"
  :class="{
    'is-active': open,
    '': !open
  }"
>
  <button @click="toggle()" class="dropdown-button">
    <i class="iconify" data-icon="feather:more-horizontal"></i>
  </button>
  <div class="drop-menu">
    <div class="menu-inner">
      <div class="menu-header">
        <h3>Actions</h3>
      </div>
      <div class="options-items">
        <a class="options-item">
            <i class="iconify" data-icon="ph:user-switch-duotone"></i>
          <div class="option-content">
            <span>Switch Account</span>
            <span>Change inbox account</span>
          </div>
        </a>
        <a class="options-item">
            <i class="iconify" data-icon="ph:paperclip-duotone"></i>
          <div class="option-content">
            <span>Attachments</span>
            <span>View all attachments</span>
          </div>
        </a>
        <a class="options-item">
            <i class="iconify" data-icon="ph:users-three-duotone"></i>
          <div class="option-content">
            <span>Contacts</span>
            <span>View all contacts</span>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
