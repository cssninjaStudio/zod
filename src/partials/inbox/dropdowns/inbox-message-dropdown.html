<div
  x-data="initDropdown()"
  @click.away="close()"
  class="dropdown-wrap is-right"
  :class="{
    'is-active': open,
    '': !open
  }"
>
  <button @click="toggle()" class="dropdown-button">
    <i class="iconify" data-icon="feather:more-horizontal"></i>
  </button>
  <div class="drop-menu">
    <div class="menu-inner">
      <div class="menu-header">
        <h3>Actions</h3>
      </div>
      <div class="options-items">
        <a class="options-item">
            <i class="iconify" data-icon="ph:arrow-arc-left-duotone"></i>
          <div class="option-content">
            <span>Forward</span>
            <span>Forward this message</span>
          </div>
        </a>
        <a class="options-item">
            <i class="iconify" data-icon="ph:arrow-bend-down-left-duotone"></i>
          <div class="option-content">
            <span>Transfer</span>
            <span>Transfer this message</span>
          </div>
        </a>
        <a class="options-item">
            <i class="iconify" data-icon="ph:bookmark-simple-duotone"></i>
          <div class="option-content">
            <span>Bookmark</span>
            <span>Bookmark this message</span>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
