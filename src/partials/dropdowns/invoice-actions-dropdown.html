<div
  x-data="initDropdown()"
  @click.away="close()"
  class="dropdown-wrap is-right"
  :class="{
    'is-active': open,
    '': !open
  }"
>
  <button @click="toggle()" class="dropdown-button">
    <i class="iconify" data-icon="feather:more-horizontal"></i>
  </button>
  <div class="drop-menu">
    <div class="menu-inner">
      <div class="menu-header">
        <h3>Actions</h3>
      </div>
      <div class="options-items">
        <a class="options-item">
          <i class="iconify" data-icon="ph:pencil-line-duotone"></i>
          <div class="option-content">
            <span>Edit</span>
            <span>Edit this invoice</span>
          </div>
        </a>
        <a class="options-item">
          <i class="iconify" data-icon="ph:check-circle-duotone"></i>
          <div class="option-content">
            <span>Review</span>
            <span>Send for review</span>
          </div>
        </a>
        <a class="options-item">
          <i class="iconify" data-icon="ph:printer-duotone"></i>
          <div class="option-content">
            <span>Print</span>
            <span>Print this invoice</span>
          </div>
        </a>
        <a class="options-item">
          <i class="iconify" data-icon="ph:paper-plane-right-duotone"></i>
          <div class="option-content">
            <span>Send</span>
            <span>Send by email</span>
          </div>
        </a>
        <a class="options-item">
          <i class="iconify" data-icon="ph:download-duotone"></i>
          <div class="option-content">
            <span>Download</span>
            <span>Download as PDF</span>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
