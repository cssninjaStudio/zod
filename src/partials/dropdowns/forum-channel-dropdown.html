<div
  x-data="initDropdown()"
  @click.away="close()"
  class="dropdown-wrap is-right"
  :class="{
    'is-active': open,
    '': !open
  }"
>
  <button @click="toggle()" class="dropdown-button">
    <i class="iconify" data-icon="feather:more-horizontal"></i>
  </button>
  <div class="drop-menu">
    <div class="menu-inner">
      <div class="menu-header">
        <h3>Actions</h3>
      </div>
      <div class="options-items">
        <a class="options-item">
            <i class="iconify" data-icon="ph:diamonds-four-duotone"></i>
          <div class="option-content">
            <span>New Topic</span>
            <span>Add a new topic</span>
          </div>
        </a>
        <a class="options-item">
            <i class="iconify" data-icon="ph:users-three-duotone"></i>
          <div class="option-content">
            <span>Moderators</span>
            <span>Manage moderators</span>
          </div>
        </a>
        <a class="options-item">
          <i class="iconify" data-icon="ph:bell-simple-duotone"></i>
        <div class="option-content">
          <span>Subscribe</span>
          <span>Manage notifications</span>
        </div>
      </a>
        <a class="options-item">
            <i class="iconify" data-icon="ph:trash-duotone"></i>
          <div class="option-content">
            <span>Delete</span>
            <span>Delete this channel</span>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
