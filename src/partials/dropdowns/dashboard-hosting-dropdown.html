<div
  x-data="initDropdown()"
  @click.away="close()"
  class="dropdown-wrap is-right"
  :class="{
    'is-active': open,
    '': !open
  }"
>
  <button @click="toggle()" class="dropdown-button">
    <i class="iconify" data-icon="feather:more-horizontal"></i>
  </button>
  <div class="drop-menu">
    <div class="menu-inner">
      <div class="menu-header">
        <h3>Actions</h3>
      </div>
      <div class="options-items">
        <a class="options-item">
          <i class="iconify" data-icon="ph:chart-pie-slice-duotone"></i>
          <div class="option-content">
            <span>Monitor</span>
            <span>See detailed stats</span>
          </div>
        </a>
        <a class="options-item">
          <i class="iconify" data-icon="ph:gear-six-duotone"></i>
          <div class="option-content">
            <span>Manage</span>
            <span>Manage server configuration</span>
          </div>
        </a>
        <a class="options-item">
          <i class="iconify" data-icon="ph:hand-duotone"></i>
          <div class="option-content">
            <span>Pause</span>
            <span>Pause server temporarily</span>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
