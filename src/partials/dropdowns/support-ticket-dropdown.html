<div
  x-data="initDropdown()"
  @click.away="close()"
  class="dropdown-wrap is-right"
  :class="{
    'is-active': open,
    '': !open
  }"
>
  <button @click="toggle()" class="dropdown-button">
    <i class="iconify" data-icon="feather:more-horizontal"></i>
  </button>
  <div class="drop-menu">
    <div class="menu-inner">
      <div class="menu-header">
        <h3>Actions</h3>
      </div>
      <div class="options-items">
        <a class="options-item">
          <i class="iconify" data-icon="ph:check-circle-duotone"></i>
          <div class="option-content">
            <span>Resolve</span>
            <span>Resolve this ticket</span>
          </div>
        </a>
        <a class="options-item">
          <i class="iconify" data-icon="ph:pencil-line-duotone"></i>
          <div class="option-content">
            <span>Edit</span>
            <span>Edit this ticket</span>
          </div>
        </a>
        <a class="options-item">
          <i class="iconify" data-icon="ph:lightning-duotone"></i>
          <div class="option-content">
            <span>Escalate</span>
            <span>Escalate to next level</span>
          </div>
        </a>
        <a class="options-item">
          <i class="iconify" data-icon="ph:paper-plane-right-duotone"></i>
          <div class="option-content">
            <span>Transfer</span>
            <span>Transfer this ticket</span>
          </div>
        </a>
        <a class="options-item">
          <i class="iconify" data-icon="ph:trash-duotone"></i>
          <div class="option-content">
            <span>Delete</span>
            <span>Delete this ticket</span>
          </div>
        </a>
      </div>
    </div>
  </div>
</div>
